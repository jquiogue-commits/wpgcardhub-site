<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WPG CardHub — Unsubscribe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://wpgcardhub.app/unsubscribe/">
  <link rel="icon" href="../assets/favicon-64.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="../">
        <img src="../assets/logo-128.jpg" alt="" width="34" height="34">
        WPG CardHub
      </a>
    </div>
  </header>

  <main>
    <section>
      <div class="wrap" style="max-width: 560px;">
        <div class="waitlist" style="text-align:left;">
          <h2 style="text-align:center;">Unsubscribe</h2>
          <p style="text-align:center;">Enter the email you signed up with and we'll remove it from our list right away.</p>

          <form id="unsub-form" class="waitlist-form" style="max-width:100%;">
            <input type="email" id="unsub-email" placeholder="you@example.com" required autocomplete="email">
            <button class="btn btn-primary" type="submit" id="unsub-submit">Unsubscribe</button>
          </form>
          <p class="waitlist-success" id="unsub-success">You're unsubscribed — you won't hear from us again.</p>
          <p class="waitlist-error" id="unsub-error"></p>
          <p class="waitlist-note">
            Still want the app? <a href="https://apps.apple.com/ca/app/wpgcardhub/id6783870189" target="_blank" rel="noopener" style="color:var(--accent-2);">Download WPG CardHub</a>.
            Questions? <a href="mailto:wpgcardhub@gmail.com" style="color:var(--accent-2);">wpgcardhub@gmail.com</a>.
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <span class="footer-copy">© 2026 WPG CardHub</span>
      <div class="footer-links">
        <a href="../">Home</a>
        <a href="https://jquiogue-commits.github.io/wpgcardhub-privacy/">Privacy &amp; Terms</a>
        <a href="mailto:wpgcardhub@gmail.com">wpgcardhub@gmail.com</a>
      </div>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="unsubscribe.js"></script>
</body>
</html>
